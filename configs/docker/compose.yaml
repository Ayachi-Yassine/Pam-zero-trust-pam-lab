# Services protected behind the PAM path (PAM-TARGET01)
services:
  web:
    image: nginx:1.27-alpine
    ports: ["192.168.70.30:8080:80"]      # published on the lab interface only
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [frontend]
    depends_on: [app]
    security_opt: ["no-new-privileges:true"]
  app:
    image: traefik/whoami:v1.10           # test app: echoes request details
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:16-alpine
    env_file: .env                        # POSTGRES_PASSWORD, see .env.example
    environment:
      POSTGRES_DB: appdb
    volumes: ["dbdata:/var/lib/postgresql/data"]
    networks: [backend]                   # internal network, no published port
    security_opt: ["no-new-privileges:true"]
networks:
  frontend:
  backend:
    internal: true
volumes:
  dbdata:
